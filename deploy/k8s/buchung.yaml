# Öffentlicher Buchungsdienst (W96): eigener Pod aus demselben Bild, kein Zugang zu Datenbank, Tresor
# oder Postfach – kennt nur das Angebot (vom Manager geschoben) und die Buchungswünsche (vom Manager
# abgeholt). Hört auf 127.0.0.1:__BUCHUNG_PORT__; nach außen über `tailscale serve` (Tailnet) bzw.
# später `tailscale funnel` (Internet, A27).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buchung-daten
  namespace: __NS__
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buchung-dienst
  namespace: __NS__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buchung-dienst
  template:
    metadata:
      labels:
        app: buchung-dienst
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: buchung
          image: BILD
          imagePullPolicy: Never
          command: ["node", "src/cli/buchung-serve.ts"]
          env:
            - name: DATA_DIR
              value: /data
            - name: BUCHUNG_PORT
              value: "__BUCHUNG_PORT__"
            - name: PRAXIS_NAME
              valueFrom:
                secretKeyRef: { name: praxis-env, key: PRAXIS_NAME, optional: true }
            - name: BUCHUNG_DATENSCHUTZ_URL
              valueFrom:
                secretKeyRef: { name: praxis-env, key: BUCHUNG_DATENSCHUTZ_URL, optional: true }
            - name: BUCHUNG_SCHLUESSEL
              valueFrom:
                secretKeyRef: { name: praxis-buchung, key: BUCHUNG_SCHLUESSEL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:__BUCHUNG_PORT__/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: daten, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: daten
          persistentVolumeClaim: { claimName: buchung-daten }
        - name: tmp
          emptyDir: {}
